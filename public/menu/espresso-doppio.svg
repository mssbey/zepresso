      fill="none" stroke="#F5F1EA" stroke-opacity="0.14" stroke-width="16.67" stroke-linecap="round" filter="url(#blurSoft)"/><path d="M 433.14 452 C 397.24 383.47 469.04 310.65 415.19 237.84"
      fill="none" stroke="#F5F1EA" stroke-opacity="0.11" stroke-width="16.38" stroke-linecap="round" filter="url(#blurSoft)"/>
  
        
