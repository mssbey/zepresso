<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.55" stop-color="#0A0D10"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9A05C" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#D9A05C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D9A05C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cf8d51" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D9A05C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="ceramic" x1="1" y1="0" x2="0" y2="0.35">
      <stop offset="0" stop-color="#544a3f"/>
      <stop offset="0.42" stop-color="#2A2F36"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="glass" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0" stop-color="#F5F1EA" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#F5F1EA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C5628"/>
      <stop offset="1" stop-color="#2E1508"/>
    </linearGradient>
    <linearGradient id="cakeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e714a"/>
      <stop offset="1" stop-color="#251106"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#D9A05C" stop-opacity="0.34"/>
      <stop offset="0.32" stop-color="#D9A05C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e6c195" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#D9A05C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D9A05C" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- sıcak yan ışık -->
  <ellipse cx="690" cy="275.44" rx="360" ry="330" fill="url(#keyLight)"/>
  <ellipse cx="400" cy="430" rx="300" ry="260" fill="url(#halo)"/>

  <!-- zemin düzlemi -->
  <rect x="0" y="610" width="800" height="190" fill="#000" opacity="0.28"/>
  <ellipse cx="400" cy="642" rx="285" ry="46" fill="#000" opacity="0.6" filter="url(#blurWide)"/>
  <ellipse cx="370" cy="628" rx="180.5" ry="26" fill="#000" opacity="0.55" filter="url(#blurSoft)"/>

