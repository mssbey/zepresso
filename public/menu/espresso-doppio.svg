    <path d="M 488.64 502 C 550.64 496 550.64 580 488.64 570"
      fill="none" stroke="#D9A05C" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  
        
    <path d="M 308 476 C 310 539.8 330 571.12 338 582 Q 338 592 355.36 594 L 444.64 594 Q 462 592 462 582 C 470 571.12 490 539.8 492 476 Z" fill="url(#ceramic)"/>
    <path d="M 308 476 C 310 539.8 330 571.12 338 582 Q 338 592 355.36 594 L 444.64 594 Q 462 592 462 582 C 470 571.12 490 539.8 492 476 Z" fill="url(#rim)" opacity="0.85"/>
    <path d="M 308 476 C 310 539.8 330 571.12 338 582 Q 338 592 355.36 594 L 444.64 594 Q 462 592 462 582 C 470 571.12 490 539.8 492 476 Z" fill="none" stroke="url(#rimStroke)" stroke-width="2.6"/>
  
        
    <ellipse cx="400" cy="476" rx="83" ry="19" fill="#1e0e05"/>
    <ellipse cx="400" cy="476" rx="78.02" ry="17.1" fill="#C98F52"/>
    <ellipse cx="424.41" cy="472.58" rx="34.86" ry="7.98" fill="#D9A05C" opacity="0.22"/>
    <ellipse cx="368.08" cy="480.18" rx="41.5" ry="7.6" fill="#170b04" opacity="0.5"/>
  
      
  <g transform="translate(293.9 688.5) rotate(28.07)">
          <ellipse cx="0" cy="6" rx="26" ry="17" fill="#000" opacity="0.4" filter="url(#blurSoft)"/>
          <ellipse cx="0" cy="0" rx="24" ry="16" fill="#4A2A12"/>
          <ellipse cx="-4" cy="-4" rx="18" ry="10" fill="#7c532c" opacity="0.8"/>
          <path d="M -18 0 C -8 -8 8 -8 18 0" fill="none" stroke="#1A0C04" stroke-width="4" stroke-linecap="round"/>
        </g><g transform="translate(384.28 681.46) rotate(74.32)">
          <ellipse cx="0" cy="6" rx="26" ry="17" fill="#000" opacity="0.4" filter="url(#blurSoft)"/>
          <ellipse cx="0" cy="0" rx="24" ry="16" fill="#4A2A12"/>
          <ellipse cx="-4" cy="-4" rx="18" ry="10" fill="#7c532c" opacity="0.8"/>
          <path d="M -18 0 C -8 -8 8 -8 18 0" fill="none" stroke="#1A0C04" stroke-width="4" stroke-linecap="round"/>
        </g><g transform="translate(494.68 691.42) rotate(162.97)">
          <ellipse cx="0" cy="6" rx="26" ry="17" fill="#000" opacity="0.4" filter="url(#blurSoft)"/>
          <ellipse cx="0" cy="0" rx="24" ry="16" fill="#4A2A12"/>
          <ellipse cx="-4" cy="-4" rx="18" ry="10" fill="#7c532c" opacity="0.8"/>
          <path d="M -18 0 C -8 -8 8 -8 18 0" fill="none" stroke="#1A0C04" stroke-width="4" stroke-linecap="round"/>
        </g>

  <!-- ışık huzmesi -->
  <ellipse cx="690" cy="365.44" rx="150" ry="220" fill="#D9A05C" opacity="0.08" filter="url(#blurWide)"/>

  <rect width="800" height="800" fill="url(#vignette)"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
