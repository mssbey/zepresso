<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.55" stop-color="#0A0D10"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E4B46A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E4B46A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E4B46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d49758" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E4B46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#574f42"/>
      <stop offset="0.42" stop-color="#2A2F36"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#F5F1EA" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#F5F1EA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8CB9A"/>
      <stop offset="1" stop-color="#8A5A2A"/>
    </linearGradient>
    <linearGradient id="cakeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd3aa"/>
      <stop offset="1" stop-color="#6e4822"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4B46A" stop-opacity="0.34"/>
      <stop offset="0.32" stop-color="#E4B46A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edce9e" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#E4B46A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E4B46A" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- sıcak yan ışık -->
  <ellipse cx="110" cy="268.71" rx="360" ry="330" fill="url(#keyLight)"/>
  <ellipse cx="400" cy="430" rx="300" ry="260" fill="url(#halo)"/>

  <!-- zemin düzlemi -->
  <rect x="0" y="626" width="800" height="174" fill="#000" opacity="0.28"/>
  <ellipse cx="400" cy="658" rx="369" ry="46" fill="#000" opacity="0.6" filter="url(#blurWide)"/>
  <ellipse cx="430" cy="644" rx="233.7" ry="26" fill="#000" opacity="0.55" filter="url(#blurSoft)"/>

  
  
        
    <ellipse cx="400" cy="644" rx="250" ry="57.5" fill="#0e1013"/>
    <ellipse cx="400" cy="634" rx="250" ry="57.5" fill="url(#ceramic)"/>
    <ellipse cx="400" cy="634" rx="247.5" ry="55.78" fill="none" stroke="#E4B46A" stroke-opacity="0.28" stroke-width="1.6"/>
    <ellipse cx="400" cy="636" rx="150" ry="31.63" fill="#0f1114" opacity="0.85"/>
    <path d="M 155 632 A 250 57.5 0 0 0 645 632"
      fill="none" stroke="#E4B46A" stroke-opacity="0.18" stroke-width="2.4" stroke-linecap="round"/>
  
        <path d="M 204 614 L 556 620 Q 578 620 576 598 L 570 442 Q 572 422 550 420 C 440 410 316 482 204 614 Z" fill="#E8CB9A"/>
        <clipPath id="cakeClip"><path d="M 204 614 L 556 620 Q 578 620 576 598 L 570 442 Q 572 422 550 420 C 440 410 316 482 204 614 Z"/></clipPath>
        <g clip-path="url(#cakeClip)">
          <rect x="200" y="410" width="400" height="220" fill="url(#cakeShade)"/>
          <path d="M 204 614 C 316 482 440 410 576 420 L 576 470 C 440 458 330 528 204 650 Z" fill="#684420" opacity="0.92"/>
          <path d="M 204 614 C 316 482 440 410 576 420 L 576 438 C 440 430 326 502 204 632 Z" fill="#3e2813"/>
          <rect x="200" y="586" width="400" height="40" fill="#533619" opacity="0.85"/>
          <rect x="200" y="410" width="90" height="240" fill="#000" opacity="0.06"/>
          <rect x="510" y="410" width="90" height="240" fill="#000" opacity="0.34"/>
        </g>
        <path d="M 204 614 L 556 620 Q 578 620 576 598 L 570 442 Q 572 422 550 420 C 440 410 316 482 204 614 Z" fill="url(#rim)" opacity="0.6"/>
        <path d="M 204 614 L 556 620 Q 578 620 576 598 L 570 442 Q 572 422 550 420 C 440 410 316 482 204 614 Z" fill="none" stroke="url(#rimStroke)" stroke-width="2.4"/>
      
  

  <!-- ışık huzmesi -->
  <ellipse cx="110" cy="358.71" rx="150" ry="220" fill="#E4B46A" opacity="0.08" filter="url(#blurWide)"/>

  <rect width="800" height="800" fill="url(#vignette)"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
