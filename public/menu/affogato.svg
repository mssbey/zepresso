<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.55" stop-color="#0A0D10"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E0AC68" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E0AC68" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E0AC68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d29357" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E0AC68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="ceramic" x1="1" y1="0" x2="0" y2="0.35">
      <stop offset="0" stop-color="#564d42"/>
      <stop offset="0.42" stop-color="#2A2F36"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="glass" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0" stop-color="#F5F1EA" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#F5F1EA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2814E"/>
      <stop offset="1" stop-color="#4E2B12"/>
    </linearGradient>
    <linearGradient id="cakeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#be956a"/>
      <stop offset="1" stop-color="#3e220e"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#E0AC68" stop-opacity="0.34"/>
      <stop offset="0.32" stop-color="#E0AC68" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ebc99d" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#E0AC68" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E0AC68" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="66"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- sıcak yan ışık -->
  <ellipse cx="690" cy="303.93" rx="360" ry="330" fill="url(#keyLight)"/>
  <ellipse cx="400" cy="430" rx="300" ry="260" fill="url(#halo)"/>

  <!-- zemin düzlemi -->
  <rect x="0" y="600" width="800" height="200" fill="#000" opacity="0.28"/>
  <ellipse cx="400" cy="632" rx="348" ry="46" fill="#000" opacity="0.6" filter="url(#blurWide)"/>
  <ellipse cx="370" cy="618" rx="220.4" ry="26" fill="#000" opacity="0.55" filter="url(#blurSoft)"/>

  <path d="M 346.7 444 C 297.51 368.55 395.88 288.38 322.11 208.21"
      fill="none" stroke="#F5F1EA" stroke-opacity="0.14" stroke-width="15.11" stroke-linecap="round" filter="url(#blurSoft)"/><path d="M 400 444 C 372.88 371.64 427.12 294.76 386.44 217.88"
      fill="none" stroke="#F5F1EA" stroke-opacity="0.16" stroke-width="13.98" stroke-linecap="round" filter="url(#blurSoft)"/><path d="M 450.95 444 C 501.59 346.78 400.32 243.48 476.27 140.18"
      fill="none" stroke="#F5F1EA" stroke-opacity="0.15" stroke-width="10.9" stroke-linecap="round" filter="url(#blurSoft)"/>
  
        
    <ellipse cx="400" cy="616" rx="232" ry="53.36" fill="#0e1013"/>
    <ellipse cx="400" cy="606" rx="232" ry="53.36" fill="url(#ceramic)"/>
    <ellipse cx="400" cy="606" rx="229.68" ry="51.76" fill="none" stroke="#E0AC68" stroke-opacity="0.28" stroke-width="1.6"/>
    <ellipse cx="400" cy="608" rx="139.2" ry="29.35" fill="#0f1114" opacity="0.85"/>
    <path d="M 172.64 604 A 232 53.36 0 0 1 627.36 604"
      fill="none" stroke="#E0AC68" stroke-opacity="0.34" stroke-width="2.4" stroke-linecap="round"/>
  
        
    <path d="M 538.9 494 C 610.9 488 610.9 566 538.9 556"
      fill="none" stroke="url(#ceramic)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 538.9 494 C 610.9 488 610.9 566 538.9 556"
      fill="none" stroke="#E0AC68" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  
        
    <path d="M 258 470 C 260 529.4 314 558.56 322 568 Q 322 578 343.84 580 L 456.16 580 Q 478 578 478 568 C 486 558.56 540 529.4 542 470 Z" fill="url(#ceramic)"/>
    <path d="M 258 470 C 260 529.4 314 558.56 322 568 Q 322 578 343.84 580 L 456.16 580 Q 478 578 478 568 C 486 558.56 540 529.4 542 470 Z" fill="url(#rim)" opacity="0.85"/>
    <path d="M 258 470 C 260 529.4 314 558.56 322 568 Q 322 578 343.84 580 L 456.16 580 Q 478 578 478 568 C 486 558.56 540 529.4 542 470 Z" fill="none" stroke="url(#rimStroke)" stroke-width="2.6"/>
  
        
    <ellipse cx="400" cy="470" rx="130" ry="31" fill="#331c0c"/>
    <ellipse cx="400" cy="470" rx="122.2" ry="27.9" fill="#F6EBD6"/>
    <ellipse cx="438.24" cy="464.42" rx="54.6" ry="13.02" fill="#E0AC68" opacity="0.22"/>
    <ellipse cx="350" cy="476.82" rx="65" ry="12.4" fill="#271609" opacity="0.5"/>
  
      
  <g transform="translate(400 444)">
        <path d="M -62 20 C -52 -30 -20 -56 0 -70 C 20 -56 52 -30 62 20 C 30 40 -30 40 -62 20 Z" fill="#F6ECD8"/>
        <path d="M -62 20 C -52 -30 -20 -56 0 -70" fill="none" stroke="#FFFBF2" stroke-width="4" stroke-opacity="0.7"/>
        <ellipse cx="0" cy="22" rx="62" ry="16" fill="#D8C7A8" opacity="0.6"/>
      </g>

  <!-- ışık huzmesi -->
  <ellipse cx="690" cy="393.93" rx="150" ry="220" fill="#E0AC68" opacity="0.08" filter="url(#blurWide)"/>

  <rect width="800" height="800" fill="url(#vignette)"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
