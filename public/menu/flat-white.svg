      fill="none" stroke="#F5F1EA" stroke-opacity="0.1" stroke-width="9.5" stroke-linecap="round" filter="url(#blurSoft)"/><path d="M 443.6 400 C 479.95 308.48 407.26 211.24 461.78 114"
      fill="none" stroke="#F5F1EA" stroke-opacity="0.12" stroke-width="14.35" stroke-linecap="round" filter="url(#blurSoft)"/>
  
        
    <ellipse cx="400" cy="630" rx="226" ry="51.98" fill="#0e1013"/>
    <ellipse cx="400" cy="620" rx="226" ry="51.98" fill="url(#ceramic)"/>
    <ellipse cx="400" cy="620" rx="223.74" ry="50.42" fill="none" stroke="#D8A868" stroke-opacity="0.28" stroke-width="1.6"/>
    <ellipse cx="400" cy="622" rx="135.6" ry="28.59" fill="#0f1114" opacity="0.85"/>
    <path d="M 178.52 618 A 226 51.98 0 0 0 621.48 618"
      fill="none" stroke="#D8A868" stroke-opacity="0.18" stroke-width="2.4" stroke-linecap="round"/>
  
        
    <path d="M 275.68 468 C 195.68 462 195.68 572 275.68 562"
      fill="none" stroke="url(#ceramic)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 275.68 468 C 195.68 462 195.68 572 275.68 562"
      fill="none" stroke="#D8A868" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  
        
    <path d="M 272 428 C 274 520.4 308 565.76 316 586 Q 316 596 339.52 598 L 460.48 598 Q 484 596 484 586 C 492 565.76 526 520.4 528 428 Z" fill="url(#ceramic)"/>
    <path d="M 272 428 C 274 520.4 308 565.76 316 586 Q 316 596 339.52 598 L 460.48 598 Q 484 596 484 586 C 492 565.76 526 520.4 528 428 Z" fill="url(#rim)" opacity="0.85"/>
    <path d="M 272 428 C 274 520.4 308 565.76 316 586 Q 316 596 339.52 598 L 460.48 598 Q 484 596 484 586 C 492 565.76 526 520.4 528 428 Z" fill="none" stroke="url(#rimStroke)" stroke-width="2.6"/>
  
        
    <ellipse cx="400" cy="428" rx="117" ry="28" fill="#422511"/>
    <ellipse cx="400" cy="428" rx="109.98" ry="25.2" fill="#E6D6BC"/>
    <ellipse cx="365.59" cy="422.96" rx="49.14" ry="11.76" fill="#D8A868" opacity="0.22"/>
    <ellipse cx="445" cy="434.16" rx="58.5" ry="11.2" fill="#331d0d" opacity="0.5"/>
  
        <path d="M 338 430 C 370 412 430 412 462 430 C 430 446 370 446 338 430 Z" fill="#ebddc8" opacity="0.7"/>
      
  

  <!-- ışık huzmesi -->
  <ellipse cx="110" cy="371.95" rx="150" ry="220" fill="#D8A868" opacity="0.08" filter="url(#blurWide)"/>

  <rect width="800" height="800" fill="url(#vignette)"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
