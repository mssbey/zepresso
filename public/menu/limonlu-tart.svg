<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.55" stop-color="#0A0D10"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E4B46A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E4B46A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E4B46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d49758" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E4B46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#574f42"/>
      <stop offset="0.42" stop-color="#2A2F36"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#F5F1EA" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#F5F1EA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFC260"/>
      <stop offset="1" stop-color="#8A6A18"/>
    </linearGradient>
    <linearGradient id="cakeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4cc79"/>
      <stop offset="1" stop-color="#6e5513"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4B46A" stop-opacity="0.34"/>
      <stop offset="0.32" stop-color="#E4B46A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edce9e" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#E4B46A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E4B46A" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="86"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- sıcak yan ışık -->
  <ellipse cx="110" cy="299.23" rx="360" ry="330" fill="url(#keyLight)"/>
  <ellipse cx="400" cy="430" rx="300" ry="260" fill="url(#halo)"/>

  <!-- zemin düzlemi -->
  <rect x="0" y="622" width="800" height="178" fill="#000" opacity="0.28"/>
  <ellipse cx="400" cy="654" rx="402" ry="46" fill="#000" opacity="0.6" filter="url(#blurWide)"/>
  <ellipse cx="430" cy="640" rx="254.6" ry="26" fill="#000" opacity="0.55" filter="url(#blurSoft)"/>

  
  
        
    <ellipse cx="400" cy="628" rx="268" ry="61.64" fill="#0e1013"/>
    <ellipse cx="400" cy="618" rx="268" ry="61.64" fill="url(#ceramic)"/>
    <ellipse cx="400" cy="618" rx="265.32" ry="59.79" fill="none" stroke="#E4B46A" stroke-opacity="0.28" stroke-width="1.6"/>
    <ellipse cx="400" cy="620" rx="160.8" ry="33.9" fill="#0f1114" opacity="0.85"/>
    <path d="M 137.36 616 A 268 61.64 0 0 0 662.64 616"
      fill="none" stroke="#E4B46A" stroke-opacity="0.18" stroke-width="2.4" stroke-linecap="round"/>
  
        <ellipse cx="400" cy="614" rx="150" ry="34" fill="#53400e" opacity="0.7"/>
        <path d="M 282 602 C 274 522 334 470 400 468 C 466 470 526 522 518 602 C 460 630 340 630 282 602 Z" fill="#DFC260"/>
        <path d="M 282 602 C 274 522 334 470 400 468 C 466 470 526 522 518 602 C 460 630 340 630 282 602 Z" fill="url(#rim)" opacity="0.75"/>
        <path d="M 282 602 C 274 522 334 470 400 468 C 466 470 526 522 518 602" fill="none" stroke="url(#rimStroke)" stroke-width="2.6"/>
        <ellipse cx="360" cy="500" rx="52" ry="26" fill="#e6cf83" opacity="0.55"/>
        <path d="M 346 500 C 380 522 420 522 454 496" fill="none" stroke="#53400e" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      
  <g transform="translate(469.6 518) rotate(-24)">
        <circle cx="0" cy="0" r="46" fill="#D9932E"/>
        <circle cx="0" cy="0" r="39" fill="#F0BE5E"/>
        <circle cx="0" cy="0" r="33" fill="#E8AC45" opacity="0.75"/>
        <g stroke="#C97F22" stroke-width="2.4" opacity="0.85">
          <path d="M 0 -33 L 0 33"/><path d="M -33 0 L 33 0"/>
          <path d="M -23 -23 L 23 23"/><path d="M -23 23 L 23 -23"/>
        </g>
      </g>

  <!-- ışık huzmesi -->
  <ellipse cx="110" cy="389.23" rx="150" ry="220" fill="#E4B46A" opacity="0.08" filter="url(#blurWide)"/>

  <rect width="800" height="800" fill="url(#vignette)"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
